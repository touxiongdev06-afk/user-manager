<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบจัดการรายชื่อผู้ใช้</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: #f0f4f8;
      margin: 0;
      padding: 40px 16px;
      color: #1f2937;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 24px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .card h3 {
      margin-top: 0;
    }

    .form-row {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      color: white;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.85; }

    .btn-add  { background: #3b82f6; }
    .btn-edit { background: #f59e0b; padding: 6px 12px; }
    .btn-del  { background: #ef4444; padding: 6px 12px; }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    li:last-child { border-bottom: none; }

    .user-info .name { font-weight: 600; }
    .user-info .age  { color: #6b7280; font-size: 14px; }

    .actions { display: flex; gap: 6px; }

    .empty {
      text-align: center;
      color: #9ca3af;
      padding: 16px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ระบบจัดการรายชื่อผู้ใช้</h1>

    <div class="card">
      <h3>เพิ่มผู้ใช้ใหม่</h3>
      <div class="form-row">
        <input id="name" placeholder="ชื่อ">
        <input id="age" type="number" placeholder="อายุ">
        <button class="btn-add" onclick="addUser()">บันทึก</button>
